        schema:
          type: string
      - in: query
        name: search
        schema:
          type: string
        description: Search
      - in: query
        name: service__icontains
        schema:
          type: string
      - in: query
        name: severity
        schema:
          type: string
          enum:
          - ''
          - critical
          - fatal
          - informational
          - major
          - minor
          - warning
        description: |-
          * `` - -- Disabled --
          * `minor` - Minor
          * `warning` - Warning
          * `major` - Major
          * `informational` - Informational
          * `fatal` - Fatal
          * `critical` - Critical
      - in: query
        name: status
        schema:
          type: string
          enum:
          - closed
          - open
        description: |-
          * `open` - Open
          * `closed` - Closed
      - in: query
        name: urgent
        schema:
          type: boolean
      - in: query
        name: value__icontains
        schema:
          type: string
