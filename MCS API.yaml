    User:
      type: object
      description: |-
        Serializer for the tenant-scoped user management endpoints.

        Write behaviour:
        - ``authorize_changes`` is surfaced as a writable field; writes are
          forwarded to the related ``CustomUser`` record (created on demand).
        - ``is_staff`` and ``is_superuser`` are only writable by superusers.
          Non-superusers receive those fields as read-only.
        - ``groups`` uses the merge-preserving M2M writer so a tenant admin
          editing a shared user never removes that user from other tenants' groups.
      properties:
        id:
          type: integer
          readOnly: true
        authorize_changes:
          type: boolean
        last_login:
          type: string
          format: date-time
          nullable: true
        is_superuser:
          type: boolean
          title: Superuser status
          description: Designates that this user has all permissions without explicitly
            assigning them.
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        is_staff:
          type: boolean
          title: Staff status
          description: Designates whether the user can log into this admin site.
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        date_joined:
          type: string
          format: date-time
        groups:
          type: array
          items:
            type: integer
          description: The groups this user belongs to. A user will get all permissions
            granted to each of their groups.
        user_permissions:
          type: array
          items:
            type: integer
          description: Specific permissions for this user.
      required:
      - id
