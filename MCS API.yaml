    PatchedGroup:
      type: object
      description: |-
        Serializer for tenant-scoped group management.

        ``tenant_count`` reflects how many tenants the group's CustomGroup is
        associated with. A group is considered "shared" when this count exceeds 1,
        which the frontend uses to gate the delete button for non-superusers.

        Write behaviour (create and update):
        - ``tenants`` (M2M): merge-preserved — a non-superuser cannot remove tenants
          they don't own; cross-tenant association is superuser-only.
        - On create by a non-superuser the new group's CustomGroup is automatically
          associated with the current tenant (orphan guard).
        - ``customers`` (M2M): limited to the current tenant's customers.
        - ``default_customer``: must be one of the selected customers.
      properties:
        id:
          type: integer
          readOnly: true
        tenant_count:
          type: integer
          readOnly: true
        tenants:
          type: array
          items:
            type: integer
        customers:
          type: array
          items:
            type: string
        default_customer:
          type: string
          nullable: true
        name:
          type: string
          maxLength: 150
        permissions:
          type: array
          items:
            type: integer
