  /api/v3/requests/:
    get:
      operationId: v3_requests_retrieve
      description: |-
        GET /api/v3/requests/

        Returns a paginated, enriched list of change requests for the authenticated
        user's tenant.  The ``kind`` field is derived server-side.  Visibility rules
        mirror those in v1 (owner-only for regular users; all-in-tenant for approvers).
      parameters:
      - in: query
        name: kind
        schema:
          type: string
        description: Filter by derived kind (Rule, Group, DBL, Combined, Empty)
      - in: query
        name: limit
        schema:
          type: integer
          default: 25
        description: Page size
      - in: query
        name: offset
        schema:
          type: integer
          default: 0
        description: Pagination offset
      - in: query
        name: q
        schema:
          type: string
        description: Free-text search over Change ID and owner username
      - in: query
        name: status
        schema:
          type: string
        description: Filter by status (New, Approving, Approved, Deploying, Processed,
          Failed)
      tags:
      - v3/requests
      security:
      - cookieAuth: []
      - basicAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
  /api/v3/user/:
    get:
      operationId: v3_user_retrieve
      description: |-
        GET /api/v3/user/

        Returns the authenticated user's slim profile together with
        ``can_approve_changes``, a flat ``permissions`` list,
        ``feature_flags``, impersonation state, and UI ``language``.
      tags:
      - v3/user
      security:
      - cookieAuth: []
      - basicAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCapability'
          description: ''
        '401':
          description: Not authenticated
  /api/v3/user/language/:
    patch:
      operationId: v3_user_language_partial_update
      description: |-
        PATCH /api/v3/user/language/

        Stores the UI language of the authenticated user. There is no user id in
        the URL: the write always targets ``request.user``. Extra fields are
        rejected so this cannot be used to change anything else. Impersonation
        is refused so the target account is left unchanged.
      tags:
      - v3/user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserLanguageUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserLanguageUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserLanguageUpdate'
      security:
      - cookieAuth: []
      - basicAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLanguageResponse'
          description: ''
        '400':
          description: Unsupported language or unexpected fields
        '401':
          description: Not authenticated
        '403':
          description: Not allowed while impersonating, or CSRF failed
