components:
  schemas:
    ActionEnum:
      enum:
      - add
      - update
      - created
      - delete
      type: string
      description: |-
        * `add` - add
        * `update` - update
        * `created` - created
        * `delete` - delete
    Alert:
      type: object
      properties:
        url:
          type: string
          maxLength: 255
        id:
          type: integer
          readOnly: true
        createtime:
          type: string
          format: date-time
          readOnly: true
          title: Create time
        lastupdate:
          type: string
          format: date-time
          readOnly: true
          title: Last update
        closetime:
          type: string
          format: date-time
          nullable: true
          title: Close time
        duplicate_count:
          type: integer
          readOnly: true
        resource:
          type: string
          maxLength: 255
        environment:
          type: string
          maxLength: 255
        correlate:
          type: string
          maxLength: 255
        event:
          type: string
          maxLength: 255
        service:
          type: string
          maxLength: 1024
        value:
          type: string
          maxLength: 255
        status:
          oneOf:
          - $ref: '#/components/schemas/AlertStatusEnum'
          - $ref: '#/components/schemas/BlankEnum'
        timeout:
          type: integer
          readOnly: true
        text:
          type: string
        type:
          type: string
          maxLength: 255
        alert_template:
          type: integer
          readOnly: true
          nullable: true
        origin:
          type: string
          maxLength: 255
        tags:
          type: string
          maxLength: 255
        severity:
          oneOf:
          - $ref: '#/components/schemas/SeverityEnum'
          - $ref: '#/components/schemas/BlankEnum'
      required:
      - alert_template
      - createtime
      - duplicate_count
      - event
      - id
      - lastupdate
      - resource
      - timeout
    AlertStatusEnum:
      enum:
      - open
      - closed
      type: string
      description: |-
        * `open` - Open
        * `closed` - Closed
    AlertTemplates:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at_timestamp:
          type: string
          format: date-time
          readOnly: true
          description: Time when this object was created
        updated_at_timestamp:
          type: string
          format: date-time
          readOnly: true
          description: Time when this object was last updated
        name:
          type: string
          maxLength: 4096
        alert_name:
          type: string
          description: Name of event to match template on.
          maxLength: 255
        notify_on_open:
          type: boolean
          description: If enabled a audio and visual notification is send to the users,
            else a silent notification is send.
        notify_on_close:
          type: boolean
          description: If enabled a audio and visual notification is send to the users,
            else a silent notification is send.
        notify_itsm:
          type: boolean
          description: Forward the alert to the ITSM as a new incident.
        itsm_group:
          type: string
          description: Specify the group that is used in creating the new incident.
          maxLength: 255
        match_value:
          type: string
          description: Regex to match on the value field.
          maxLength: 4096
        match_service:
          type: string
          description: Regex to match on the service field.
          maxLength: 4096
        match_environment:
          type: string
          description: Regex to match on the environment field.
          maxLength: 4096
        match_severity:
          type: string
          description: Regex to match on the severity field.
          maxLength: 4096
        match_resource:
          type: string
          description: Regex to match on the resource field.
          maxLength: 4096
        override_severity:
          oneOf:
          - $ref: '#/components/schemas/OverrideSeverityEnum'
          - $ref: '#/components/schemas/BlankEnum'
        created_by_user:
          type: integer
          readOnly: true
          nullable: true
          description: User who created this object
        updated_by_user:
          type: integer
          readOnly: true
          nullable: true
          description: User who last updated this object
        telegram_template:
          type: integer
          nullable: true
        notification_schema:
          type: array
          items:
            type: integer
          description: The notification schema determines which users receive a notification.
      required:
      - created_at_timestamp
      - created_by_user
      - id
      - updated_at_timestamp
      - updated_by_user
    Application:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Name of the application
          maxLength: 255
        pentested:
          type: boolean
          description: Has the application been pentested.
        pentest_type:
          allOf:
          - $ref: '#/components/schemas/PentestTypeEnum'
          description: |-
            Type if pentest

            * `blackbox` - Blackbox
            * `graybox` - Graybox
            * `whitebox` - Whitebox
            * `unknown` - Unknown
        pentest_date:
          type: string
          format: date
          nullable: true
          description: Date of the pentest
        pentest_findings:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          description: Number of findings in the pentest
      required:
      - id
      - name
    Architecture:
      type: object
      description: Read nested customer summary; write customer as PK.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Display name for this Topology / Architecture.
          maxLength: 255
        description:
          type: string
          maxLength: 1024
        customer:
          allOf:
          - $ref: '#/components/schemas/CustomerSerializerMinimal'
          readOnly: true
        customer_id:
          type: string
          writeOnly: true
        created_at_timestamp:
          type: string
          format: date-time
          readOnly: true
          description: Time when this object was created
        updated_at_timestamp:
          type: string
          format: date-time
          readOnly: true
          description: Time when this object was last updated
        created_by_user:
          allOf:
          - $ref: '#/components/schemas/UserSlim'
          readOnly: true
        updated_by_user:
          allOf:
          - $ref: '#/components/schemas/UserSlim'
          readOnly: true
      required:
      - created_at_timestamp
      - created_by_user
      - customer
      - customer_id
      - id
      - name
      - updated_at_timestamp
      - updated_by_user
    Attribute:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_by_user:
          allOf:
          - $ref: '#/components/schemas/UserSlim'
          readOnly: true
        updated_by_user:
          allOf:
          - $ref: '#/components/schemas/UserSlim'
          readOnly: true
        created_at_timestamp:
          type: string
          format: date-time
          readOnly: true
          description: Time when this object was created
        updated_at_timestamp:
          type: string
          format: date-time
          readOnly: true
          description: Time when this object was last updated
        name:
          type: string
          description: Name of the attribute.
          maxLength: 255
        value:
          type: string
          description: Value of the attribute, can be anything.
          maxLength: 2048
      required:
      - created_at_timestamp
      - created_by_user
      - id
      - name
      - updated_at_timestamp
      - updated_by_user
      - value
    Audit:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_by_user:
          allOf:
          - $ref: '#/components/schemas/UserSlim'
          readOnly: true
        updated_by_user:
          allOf:
          - $ref: '#/components/schemas/UserSlim'
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/UserSlim'
          readOnly: true
        team:
          allOf:
          - $ref: '#/components/schemas/GroupSlim'
          readOnly: true
        tenant:
          allOf:
          - $ref: '#/components/schemas/TenantSlim'
          readOnly: true
        created_at_timestamp:
          type: string
          format: date-time
          readOnly: true
          description: Time when this object was created
