    get:
      operationId: dns_domains_list
      description: |-
        API endpoint that allows DNS zones to be listed, retrieved, edited and deleted.

        Zones are not created here — they are synced from the DNS provider — so the
        create verb is intentionally omitted. ``provider`` is read-only on the
        serializer, so update (PATCH) can never change the provider.
      parameters:
      - in: query
        name: customer
        schema:
          type: string
      - in: query
        name: name__icontains
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: provider
        schema:
          type: integer
      - in: query
        name: type
        schema:
          type: string
          enum:
          - external
          - internal
        description: |-
          Use type of domain, internal within the datacenter or external on the internet.

          * `external` - External
          * `internal` - Internal
      - in: query
        name: zone_type
        schema:
          type: string
          enum:
          - forward
          - reverse
        description: |-
          Zone type: forward (A, CNAME, MX, ...) or reverse (PTR, in-addr.arpa).

          * `forward` - Forward
          * `reverse` - Reverse
