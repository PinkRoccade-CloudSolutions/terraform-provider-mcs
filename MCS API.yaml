    delete:
      operationId: access_management_groups_destroy
      description: |-
        Safe group removal that respects shared groups.

        - Superuser: hard-deletes the group outright.
        - Non-superuser: detaches the current tenant from the group's
          ``CustomGroup.tenants``.  The ``Group`` record is only truly deleted
          once no tenant associations remain.
