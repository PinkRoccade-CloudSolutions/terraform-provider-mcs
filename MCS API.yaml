  /api/networking/domain/{domain}/rules/{policyid}/header/:
    post:
      operationId: networking_domain_rules_header_create
      description: |-
        Rename (or set) the FortiManager section label for the rule's section.

        Mirrors the legacy ``/firewall/manage/<vdom>/<policyid>/header/`` form
        view: calls ``Rule.create_header(name)`` which sets the policy
        ``section value`` (global-label) on FortiManager.

        This is an immediate device change (not staged into a change request).
        Requires ``firewall.change_rule``; does **not** require
        ``firewall.direct_management`` so change-request-mode operators can
        still rename sections.
      parameters:
      - in: path
        name: domain
        schema:
          type: string
          pattern: ^.+$
        required: true
      - in: path
        name: policyid
        schema:
          type: string
        required: true
      tags:
      - networking
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 25
                  description: New section (global-label) name.
              required:
              - name
      security:
      - cookieAuth: []
      - basicAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
