      parameters:
      - in: query
        name: active
        schema:
          type: boolean
      - in: query
        name: create_time
        schema:
          type: string
          format: date-time
      - in: query
        name: created_at_timestamp
        schema:
          type: string
          format: date-time
      - in: query
        name: created_by_user
        schema:
          type: integer
      - in: query
        name: day
        schema:
          type: string
          enum:
          - '*'
          - '-'
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'
          - '7'
        description: |-
          Day of the week to run in format: 1-7 where 1 is a monday, or use * as a wildcard to run every hour.

          * `*` - Every day
          * `1` - Monday
          * `2` - Tuesday
          * `3` - Wednesday
          * `4` - Thursday
          * `5` - Friday
          * `6` - Saturday
          * `7` - Sunday
          * `-` - Disabled
